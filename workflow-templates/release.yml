name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f manifest.json
          test -f main.js
          test -f styles.css

      - name: Build zip
        run: zip -j beikao-helper.zip manifest.json main.js styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
            beikao-helper.zip
          generate_release_notes: true
